[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adct"
version = "0.1.0"
description = "Action and Detection Chunking with Transformers based on an Experience Tree"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Bo Wang" },
    { name = "Guozhi Zhan" },
    { name = "Jun Shang" },
    { name = "Qinyuan Liu" },
]
keywords = [
    "robotics",
    "imitation-learning",
    "action-chunking",
    "transformer",
    "robot-grasping",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
    "safetensors>=0.4",
    "torch>=2.2",
    "torchvision>=0.17",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
adct-build-tree = "adct.cli.build_tree:main"
adct-prepare-data = "adct.cli.prepare_data:main"
adct-train = "adct.cli.train:main"
adct-inspect = "adct.cli.inspect_checkpoint:main"

[project.urls]
paper = "https://doi.org/10.1109/LRA.2026.3706944"

[tool.setuptools.packages.find]
where = ["src"]
include = ["adct*", "RT_DETR*"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["src/RT_DETR"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

